name: Cageforge native security integration

on:
  push:
    branches: [main, develop, dev]
    paths:
      - 'modules/boss-ipc/**'
      - 'modules/boss-process-manager/**'
      - 'composeApp/build.gradle.kts'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/DynamicPluginManager.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/SecurityRequiredPlugin.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppDialogs.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppEventBusEffects.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppState.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/dialogs/PluginSandboxApprovalDialog.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxApproval.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/SecurityRequiredPlugin.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/OutOfProcessPluginSpawnerImpl.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxApprovalCoordinator.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxRequest.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginIpcEndpoint.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginPolicy.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginProcessSession.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginStateBridge.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginProcessConfig.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginRuntime.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ValidatedPluginSandboxRequest.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/plugin/PluginLoaderDelegateImpl.kt'
      - 'composeApp/src/desktopTest/kotlin/ai/rever/boss/components/plugin/**'
      - 'composeApp/src/desktopTest/kotlin/ai/rever/boss/components/dialogs/**'
      - 'gradle/libs.versions.toml'
      - 'ci/cageforge-qemu-suite/**'
      - 'ci/run-cageforge-native-linux-vm.sh'
      - '.github/workflows/cageforge-native-security.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'modules/boss-ipc/**'
      - 'modules/boss-process-manager/**'
      - 'composeApp/build.gradle.kts'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/DynamicPluginManager.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/SecurityRequiredPlugin.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppDialogs.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppEventBusEffects.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/app/BossAppState.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/dialogs/PluginSandboxApprovalDialog.kt'
      - 'composeApp/src/commonMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxApproval.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/SecurityRequiredPlugin.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/OutOfProcessPluginSpawnerImpl.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxApprovalCoordinator.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginSandboxRequest.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginIpcEndpoint.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginPolicy.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginProcessSession.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/PluginStateBridge.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginProcessConfig.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ProtectedPluginRuntime.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/components/plugin/ValidatedPluginSandboxRequest.kt'
      - 'composeApp/src/desktopMain/kotlin/ai/rever/boss/plugin/PluginLoaderDelegateImpl.kt'
      - 'composeApp/src/desktopTest/kotlin/ai/rever/boss/components/plugin/**'
      - 'composeApp/src/desktopTest/kotlin/ai/rever/boss/components/dialogs/**'
      - 'gradle/libs.versions.toml'
      - 'ci/cageforge-qemu-suite/**'
      - 'ci/run-cageforge-native-linux-vm.sh'
      - '.github/workflows/cageforge-native-security.yml'
  workflow_dispatch:

concurrency:
  group: cageforge-native-security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# This workflow owns native security smoke on all supported desktop backends. Linux runs in a
# disposable QEMU/KVM guest because an ordinary Ubuntu runner is not a controlled kernel:
# unprivileged user namespaces may be disabled by host policy (for example, uid-map setup can
# fail with EPERM), and a green host-side test would not prove Cageforge's Bubblewrap boundary.
# The Linux image is pinned and verified, its namespace prerequisites are probed, and the smoke
# runs with restricted guest networking. macOS and Windows use their native runners because
# Seatbelt and the Windows setup/Job Object boundary must be exercised on their own kernels.
# Missing native prerequisites are hard failures, never successful skips. Ordinary JVM/process/IPC
# tests remain in the portable BOSS CI jobs.
jobs:
  linux-qemu:
    name: BOSS native security smoke in Cageforge QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CAGEFORGE_VM_IMAGE_URL: https://cloud-images.ubuntu.com/noble/20260814/noble-server-cloudimg-amd64.img
      CAGEFORGE_VM_IMAGE_SHA256: 6e40c07ae715f744f84af0bec76415cc1987dd115b4b8de437818561f01a3733
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes genisoimage qemu-system-x86 qemu-utils

      - name: Verify KVM access
        run: |
          set -euo pipefail
          test -c /dev/kvm || {
            echo 'CAGEFORGE_KVM_UNAVAILABLE: /dev/kvm is not available' >&2
            exit 86
          }
          sudo chmod 0666 /dev/kvm

      - name: Restore the pinned Ubuntu guest image
        id: guest-image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/noble-server-cloudimg-amd64.img
          key: boss-cageforge-ubuntu-noble-20260814-amd64-${{ env.CAGEFORGE_VM_IMAGE_SHA256 }}

      - name: Download the pinned Ubuntu guest image
        if: steps.guest-image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/noble-server-cloudimg-amd64.img"
          curl --fail --silent --show-error --location --retry 3 \
            --max-filesize 1073741824 --max-time 900 \
            "$CAGEFORGE_VM_IMAGE_URL" --output "$image"

      - name: Verify the pinned Ubuntu guest image
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/noble-server-cloudimg-amd64.img"
          test -s "$image"
          printf '%s  %s\n' "$CAGEFORGE_VM_IMAGE_SHA256" "$image" | sha256sum --check --status
          echo "CAGEFORGE_VM_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Cache the verified Ubuntu guest image
        if: steps.guest-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/noble-server-cloudimg-amd64.img
          key: boss-cageforge-ubuntu-noble-20260814-amd64-${{ env.CAGEFORGE_VM_IMAGE_SHA256 }}

      # Compile only the native smoke consumer on the ordinary Linux runner.
      # The guest must execute the exact compiled BOSS process code, but it
      # should not repeat Gradle/Kotlin dependency resolution under QEMU.
      - name: Build native security test bundle
        run: |
          ./gradlew \
            :boss-process-manager:nativeSecurityTestBundle \
            --no-daemon \
            --max-workers=2 \
            --console=plain

      - name: Verify native security test bundle
        run: |
          set -euo pipefail
          bundle="modules/boss-process-manager/build/nativeSecurityTest/boss-native-security-test-bundle.tar.gz"
          test -s "$bundle"
          launcher="$(tar -tzf "$bundle" | grep -Fx 'ci/cageforge-qemu-suite/run.sh')"
          test -n "$launcher"
          ipc_jar="$(tar -tzf "$bundle" | grep -E '^lib/boss-ipc-[^/]+\.jar$' | head -n 1)"
          test -n "$ipc_jar"
          extracted_ipc_jar="$RUNNER_TEMP/boss-ipc-bundle-verification.jar"
          tar -xOzf "$bundle" "$ipc_jar" > "$extracted_ipc_jar"
          jar tf "$extracted_ipc_jar" | grep -Fx 'ai/rever/boss/ipc/IpcAddressResolver.class'
          tar -xOzf "$bundle" "$launcher" | grep -F 'classpath_entries=' >/dev/null

      - name: Stage native security test bundle
        run: |
          cp \
            modules/boss-process-manager/build/nativeSecurityTest/boss-native-security-test-bundle.tar.gz \
            "$RUNNER_TEMP/boss-native-security-test-bundle.tar.gz"

      - name: Run BOSS native security smoke in the guest
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          CAGEFORGE_VM_ARTIFACTS: ${{ runner.temp }}/boss-cageforge-vm-logs
        run: |
          ./ci/run-cageforge-native-linux-vm.sh \
            --image "$CAGEFORGE_VM_IMAGE" \
            --test-bundle "$RUNNER_TEMP/boss-native-security-test-bundle.tar.gz"

      - name: Upload QEMU and guest boot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boss-cageforge-native-security-logs
          path: ${{ runner.temp }}/boss-cageforge-vm-logs
          if-no-files-found: warn
          retention-days: 7

  macos-native:
    name: BOSS native security smoke on macOS
    runs-on: macos-15
    timeout-minutes: 30
    # cageforge-java 0.6.1 exposes the macOS executable-root mapping required
    # by Seatbelt for the JVM runtime, so this native lane is a required gate.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # macOS uses Cageforge's native Seatbelt backend directly. It does not
      # need QEMU; the runner itself is the native enforcement environment.
      - name: Inspect macOS Java runtime
        run: |
          set -eu
          java_bin="$(command -v java)"
          real_java="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$java_bin")"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "java.home=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.home = //p')"
          echo "java_bin=$java_bin"
          echo "real_java=$real_java"
          echo "java_home_bin=$JAVA_HOME/bin/java"
          ls -ld "$JAVA_HOME" "$JAVA_HOME/bin" "$JAVA_HOME/bin/java" "$real_java"
          otool -L "$real_java"

      - name: Run native security smoke
        timeout-minutes: 8
        run: |
          ./gradlew \
            :boss-process-manager:nativeSecurityTest \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            --stacktrace

      - name: Collect macOS Seatbelt diagnostics
        if: failure()
        run: |
          set +e
          log show --last 5m --style compact \
            --predicate 'process == "sandboxd" OR eventMessage CONTAINS[c] "deny"' \
            > "$RUNNER_TEMP/cageforge-macos-sandbox.log"
          tail -n 2000 "$RUNNER_TEMP/cageforge-macos-sandbox.log" > \
            "$RUNNER_TEMP/cageforge-macos-sandbox-tail.log"

      - name: Upload macOS native security test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boss-cageforge-macos-security-results
          path: |
            modules/boss-process-manager/build/test-results/nativeSecurityTest/
            modules/boss-process-manager/build/reports/tests/nativeSecurityTest/
            ${{ runner.temp }}/cageforge-macos-sandbox-tail.log
          if-no-files-found: warn
          retention-days: 7

  windows-native:
    name: BOSS native security smoke on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The protected BOSS launch path verifies Cageforge's persistent,
      # owner-scoped Windows setup but never invokes UAC implicitly. Provisioning
      # is therefore an explicit CI step, separate from the protected launch.
      # The BOSS IPC resolver uses the same Windows named-pipe transport as the
      # protected policy. The smoke must therefore prove both allowed and denied
      # named-pipe access after the explicit Cageforge setup is ready.
      - name: Provision Cageforge Windows prerequisites
        env:
          CAGEFORGE_WINDOWS_SETUP_MARKER: ${{ runner.temp }}/cageforge-windows-setup-owned
        run: |
          ./gradlew \
            :boss-process-manager:windowsNativeSecuritySetup \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            --stacktrace

      - name: Run native security smoke
        timeout-minutes: 8
        run: |
          ./gradlew \
            :boss-process-manager:nativeSecurityTest \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            --stacktrace

      - name: Remove Cageforge Windows prerequisites
        if: always()
        env:
          CAGEFORGE_WINDOWS_SETUP_MARKER: ${{ runner.temp }}/cageforge-windows-setup-owned
        run: |
          ./gradlew \
            :boss-process-manager:windowsNativeSecurityTeardown \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            --stacktrace

      - name: Upload Windows native security test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boss-cageforge-windows-security-results
          path: |
            modules/boss-process-manager/build/test-results/nativeSecurityTest/
            modules/boss-process-manager/build/reports/tests/nativeSecurityTest/
          if-no-files-found: warn
          retention-days: 7
